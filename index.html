<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Eging Again</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/beautifuljekyll.css">
  <link rel="stylesheet" href="/assets/css/spellbot.css">
  <style>
    /* 로고 중앙 정렬 및 회전 차단 */
    .avatar-container {
      position: absolute !important;
      left: 50% !important;
      width: 100px !important;
      height: 100px !important;
      margin-left: -50px !important;
      bottom: -50px !important;
      z-index: 1001 !important;
    }
    .avatar-img-border {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .avatar-img {
      animation: none !important; -webkit-animation: none !important; transform: none !important;
      width: 100% !important; height: 100% !important; object-fit: cover; display: block;
    }
    #typed { color: #ff4d4d; font-weight: bold; }
    .intro-header { padding: 160px 0 100px !important; }
    body { background-color: #1a202c; color: white; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-xl navbar-light fixed-top navbar-custom top-nav-regular">
    <a class="navbar-brand" href="/">Eging Again</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-navbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-navbar">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="https://spelltable.wizards.com/">About Me</a></li>
        <li class="nav-item"><a class="nav-link" href="https://www.patreon.com/lexicalunit">Patreon</a></li>
        <li class="nav-item"><a class="nav-link" href="https://github.com/lexicalunit/spellbot">Dev</a></li>
      </ul>
    </div>
    <div class="avatar-container">
      <div class="avatar-img-border">
        <a href="/">
          <img alt="Avatar" class="avatar-img" src="/assets/img/avatar-icon.png">
        </a>
      </div>
    </div>
  </nav>

  <header class="header-section">
    <div class="intro-header">
      <div class="container-md">
        <div class="row">
          <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
            <div class="page-heading" style="text-align: center;">
              <h1 style="font-size: clamp(2rem, 7vw, 4rem); white-space: nowrap;">What do you do for fun?</h1>
              <hr class="small">
              <span class="page-subheading" style="font-size: 1.5rem;">I write about <span id="typed"></span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-md">
    <div class="row">
      <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
        <div style="text-align: center; margin-bottom: 50px;">
          <button type="button" onclick="location.href='https://open.kakao.com/o/YOUR_ID';"
            style="background-color: #FEE500; color: #191919; border: none; padding: 15px 30px; font-weight: bold; border-radius: 8px; cursor: pointer;">
            CHAT ME
          </button>
        </div>
        <article style="text-align: center; line-height: 1.8;">
          <p style="font-size: 1.2rem;">낚시, 보안(CTF), 그리고 일상의 기록을 담는 블로그입니다.</p>
          <img src="https://github.com/lexicalunit/spellbot/assets/1903876/39381709-8dfd-473e-8072-e7267c50b4ad" 
               style="max-width: 100%; border-radius: 15px; margin-top: 20px;">
        </article>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      new Typed("#typed", {
        strings: ["Fishing.", "CTF.", "TFT.", "Study."],
        typeSpeed: 70, backSpeed: 40, loop: true
      });
    });
  </script>
</body>
</html>
