    /* 1. 로고 완벽 중앙 정렬 및 크기 최적화 */
    .avatar-container {
      position: absolute !important;
      left: 50% !important;
      bottom: 0 !important; /* 내비게이션 바 하단 경계선에 맞춤 */
      width: 100px !important;
      height: 100px !important;
      margin-left: -50px !important; /* 너비의 절반만큼 왼쪽으로 이동 */

    }
    .avatar-img-border {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 3px solid #1a202c; /* 배경색과 맞춘 테두리로 깔끔하게 */
    }
    .avatar-img {
      animation: none !important; 
      -webkit-animation: none !important; 
      transform: none !important;
      width: 100% !important; 
      height: 100% !important; 
      object-fit: cover; 
      display: block;
    }
