<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>SpellBot</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/beautifuljekyll.css">
  <link rel="stylesheet" href="/assets/css/spellbot.css">

  <style>
    body { background-color: #1a202c; color: white; }
    
    /* 타이핑 효과 중앙 정렬 */
    .typed-wrapper {
      font-size: 2rem;
      display: block;
      text-align: center;
      margin-top: 1rem;
    }
    #typed { color: red; }

    /* 로고 섹션 정렬 (가로 나열 및 투명 배경) */
    .where {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 50px !important;
      padding: 40px 0 !important;
    }
    .where div { width: 180px !important; text-align: center !important; }
    .where img {
      width: 180px !important;
      height: 180px !important;
      object-fit: contain !important;
      background-color: transparent !important;
      border-radius: 50% !important;
      display: block !important;
      margin: 0 auto 15px !important;
      transition: transform 0.2s ease-in-out;
    }
    .where a:hover img { transform: translateY(-8px); }
    .where a {
      display: inline-block !important;
      text-decoration: none !important;
      font-weight: bold !important;
      color: white !important;
      border-bottom: 5px solid #f9d923 !important; /* 노란 밑줄 */
      padding-bottom: 2px !important;
    }
    .screenshot { border-radius: 10px; margin-top: 20px; max-width: 100%; }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-xl navbar-light fixed-top navbar-custom top-nav-regular">
    <a class="navbar-brand" href="/">Eging Again</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-navbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-navbar">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="https://spelltable.wizards.com/">About Me</a></li>
        <li class="nav-item"><a class="nav-link" href="https://github.com/asvoice">Dev</a></li>
      </ul>
    </div>
    <div class="avatar-container">
      <div class="avatar-img-border">
        <a href="/"><img alt="Avatar" class="avatar-img" src="/assets/img/avatar-icon.png" /></a>
      </div>
    </div>
  </nav>

  <header class="header-section">
    <div class="intro-header">
      <div class="container-md">
        <div class="page-heading" style="text-align: center;">
          <h1 style="font-size: clamp(2rem, 7vw, 4rem);">Hunter!?</h1>
          <hr class="small">
          <span class="page-subheading">Squid and Code.</span>
          <span class="page-subheading typed-wrapper">
            I write about <span id="typed"></span>
          </span>
        </div>
      </div>
    </div>
  </header>

  <main class="container-md">
    <div class="row">
      <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
        
        <div class="where">
          <div>
            <a href="https://www.instagram.com/rush_eging_team/" target="_blank">
              <img src="/assets/img/rush.png" alt="Rush Team">
              Rush Team
            </a>
          </div>
          <div>
            <a href="https://www.instagram.com/big_angler_seok/" target="_blank">
              <img src="/assets/img/big2.png" alt="big_angler">
              big_angler
            </a>
          </div>
        </div>

        <section id="fine-print" style="text-align: center; margin-top: 50px;">
          <h2>🔍 Join-Rush Team</h2>
          <p>Join my crew. <code>/message to instagram</code></p>
          <img class="screenshot" src="https://raw.githubusercontent.com/asvoice/asvoice.github.io/refs/heads/main/assets/img/insta.PNG" alt="Instagram Capture">
        </section>

      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      new Typed("#typed", {
        strings: ["Fishing.", "CTF.", "Teamfight Tactics.", "Study."],
        typeSpeed: 70, backSpeed: 40, backDelay: 1500, loop: true
      });
    });
  </script>
</body>
</html>
