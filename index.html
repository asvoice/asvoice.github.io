<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    new Typed("#typed", {
      strings: ["Fishing.", "CTF.", "Diary.", "Study."],
      typeSpeed: 60,
      backSpeed: 35,
      backDelay: 1400,
      startDelay: 300,
      loop: true,
      smartBackspace: true,
      showCursor: true,
      cursorChar: "|"
    });
  });
