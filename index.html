<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>SpellBot</title>

  <!-- CSS 링크 -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/beautifuljekyll.css">
  <link rel="stylesheet" href="/assets/css/spellbot.css">

  <!-- Typed.js CSS 스타일 -->
  <style>
    #typed {
      color: #e60012; /* 빨간색 */
      font-weight: 600;
    }
    .typed-cursor {
      color: #e60012;
      font-weight: 400;
      animation: typedBlink 0.7s infinite;
    }
    @keyframes typedBlink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-xl navbar-light fixed-top navbar-custom top-nav-regular">
    <a class="navbar-brand" href="https://spellbot.io/">SpellBot</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-navbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-navbar">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="https://asvoice.github.io/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="https://spelltable.wizards.com/">About Me</a></li>
        <li class="nav-item"><a class="nav-link" href="https://www.patreon.com/lexicalunit">Patreon</a></li>
        <li class="nav-item"><a class="nav-link" href="https://github.com/lexicalunit/spellbot">Dev</a></li>
        <li class="nav-item"><a class="nav-link" href="https://prod.app.spellbot.io/status">Status</a></li>
      </ul>
    </div>
    <div class="avatar-container">
      <div class="avatar-img-border">
        <a href="https://asvoice.github.io/">
          <img alt="Navigation bar avatar" class="avatar-img" src="/assets/img/avatar-icon.png" />
        </a>
      </div>
    </div>
  </nav>

  <header class="header-section">
    <div class="intro-header">
      <div class="container-md">
        <div class="row">
          <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
            <div class="page-heading">
              <h1>Eging . Agagin</h1>
              <hr class="small">
              <!-- 여기에서 타이핑 글자 적용 -->
              <span class="page-subheading">
                fishing & Computer
                <br>
                I write about <span id="typed"></span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-md">
    <div class="row">
      <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
        <!-- 기존 컨텐츠 그대로 유지 -->
      </div>
    </div>
  </main>

  <footer>
    <div class="container-md beautiful-jekyll-footer">
      <div class="row">
        <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
          <p class="copyright text-muted">Amy Troschinetz &bull; 2026 &bull; <a href="https://spellbot.io/">SpellBot.io</a></p>
          <p class="theme-by text-muted">Powered by <a href="https://beautifuljekyll.com">Beautiful Jekyll</a></p>
        </div>
      </div>
    </div>
  </footer>

  <!-- JS 링크 -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="/assets/js/beautifuljekyll.js"></script>
  <script src="/assets/js/spellbot.js"></script>

  <!-- Typed.js 적용 -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    var typed = new Typed("#typed", {
      strings: ["Fishing", "Diary", "CTF.."], // 바꾸고 싶은 글자
      typeSpeed: 60,
      backSpeed: 40,
      backDelay: 1400,
      loop: true
    });
  </script>
</body>
</html>
