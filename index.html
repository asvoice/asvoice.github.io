<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Eging Again</title>
  
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/beautifuljekyll.css">
  <link rel="stylesheet" href="/assets/css/spellbot.css">

  <style>
    /* 로고 중앙 배치 */
    .avatar-container {
      position: absolute !important;
      left: 50% !important;
      bottom: 0 !important;
      width: 100px !important;
      height: 100px !important;
      margin-left: -50px !important;
      margin-bottom: -50px !important;
      z-index: 1001 !important;
    }
    .avatar-img-border {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50% !important;
      overflow: hidden !important;
    }
    .avatar-img {
      animation: none !important;
      transform: none !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* 상단 타이틀 간격 */
    .intro-header {
      padding: 100px 0 60px !important;
    }

    /* [수정] I write about 중앙 정렬 및 강조 */
    .typing-container {
      display: flex;
      justify-content: center; /* 가로 중앙 */
      align-items: center;
      width: 100%;
      text-align: center;
      margin-top: 20px;
    }

    .highlight-text {
      font-size: 2.5rem !important; /* 크기 크게 */
      font-weight: 800 !important; /* 진하게 */
      color: white;
    }

    #typed {
      color: #ff4d4d !important; /* 타이핑 글자 빨간색 */
    }
    
    .typed-cursor {
      color: #ff4d4d;
      font-size: 2.5rem;
    }
  </style>
</head>

<body style="background-color: #1a202c; color: white;">

  <nav class="navbar navbar-expand-xl navbar-light fixed-top navbar-custom top-nav-regular">
    <a class="navbar-brand" href="/">Eging Again</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#main-navbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-navbar">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Eging</a></li>
        <li class="nav-item"><a class="nav-link" href="#">CTF</a></li>
      </ul>
    </div>
    <div class="avatar-container">
      <div class="avatar-img-border">
        <a href="/"><img alt="Avatar" class="avatar-img" src="/assets/img/avatar-icon.png" /></a>
      </div>
    </div>
  </nav>

  <header class="header-section">
    <div class="intro-header">
      <div class="container-md">
        <div class="row">
          <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
            <div class="page-heading" style="text-align: center;">
              <h1 style="font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900;">Hunter!?</h1>
              <hr class="small">
              <span class="page-subheading" style="display: block; margin-bottom: 20px;">Squid and Code.</span>
              
              <div class="typing-container">
                <span class="highlight-text">
                  I write about <span id="typed"></span>
                </span>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container-md">
    </main>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      new Typed("#typed", {
        strings: ["Fishing.", "CTF.", "Teamfight Tactics.", "Study."],
        typeSpeed: 70,
        backSpeed: 40,
        backDelay: 1500,
        loop: true,
        showCursor: true,
        cursorChar: "|"
      });
    });
  </script>
</body>
</html>
